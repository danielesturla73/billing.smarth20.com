{% extends "base.html" %}
{% block titolo %}Accesso — Analisi Consumi da Fatturazione{% endblock %}
{% block contenuto %}
<div class="panel box-accesso">
  <h2>Accesso</h2>
  {% if errore %}<div class="avviso">{{ errore }}</div>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="campo"><label for="username">Username</label>
      <input id="username" type="text" name="username" required autofocus autocomplete="username"></div>
    <div class="campo"><label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password"></div>
    <button type="submit" class="btn-primario">Entra</button>
  </form>
</div>
{% endblock %}
